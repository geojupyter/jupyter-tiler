name: "Build"

on:
  push:
    branches: "main"
  pull_request:
    branches: "*"


concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e" # v10.3.2

      - name: "Install dependencies"
        run: "uv sync --group dev --group test"

      - name: "Check the server extension is installed"
        run: |
          set -eux
          uv run jupyter server extension list
          uv run jupyter server extension list 2>&1 | grep -ie "jupyter_tiler.*OK"

      - name: "Test"
        run: "uv run pytest -vv -r ap --cov"

      - name: "Package the extension"
        run: "uv build"

      - name: "Upload extension packages"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "extension-artifacts"
          path: "dist/jupyter_tiler*"
          if-no-files-found: "error"

  test_isolated:
    needs: "build"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Install Python"
        uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e" # v10.3.2

      - uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "extension-artifacts"

      - name: "Install from wheel"
        run: |
          uv pip install --system "jupyterlab>=4.0.0,<5" jupyter_tiler*.whl

      - name: "Check the server extension is installed"
        run: |
          set -eux
          jupyter server extension list
          jupyter server extension list 2>&1 | grep -ie "jupyter_tiler.*OK"
