name: "Check links"

on:
  push:
    branches: "main"
  pull_request:
    branches: "*"


concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  check_links:
    name: "Check Links"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - uses: "jupyterlab/maintainer-tools/.github/actions/base-setup@94b14ddfbdd1ed651e9f9343ae2409ab5c73a6a8" # v1

      - uses: "jupyterlab/maintainer-tools/.github/actions/check-links@94b14ddfbdd1ed651e9f9343ae2409ab5c73a6a8" # v1
        with:
          # Allow absolute links; any broken links will get caught in the docs build
          ignore_links: >-
            ^/.*
            https://leafmap\.org.*
