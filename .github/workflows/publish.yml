name: "Publish to PyPI"

on:
  release:
    types: ["published"]


jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e" # v10.3.2
        with:
          # Disable cache for release workflow only to avoid cache-poisoning attack
          # See: <https://docs.zizmor.sh/audits/#cache-poisoning>
          enable-cache: false

      - run: "uv build"

      - uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "dist"
          path: "dist/"

  pypi-publish:
    name: "Upload dist to PyPI"
    needs: "build"
    runs-on: "ubuntu-latest"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/jupyter-tiler"
    permissions:
      id-token: "write"
    steps:
      - name: "Get dist artifact"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "dist"
          path: "dist/"

      - name: "Upload dist to PyPI"
        uses: "pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086" # v1.14.3
